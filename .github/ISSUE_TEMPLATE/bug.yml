name: Bug
description: ccdrift crashed, printed something wrong, or alerted when it shouldn't have.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        This issue is public. Please don't paste anything from your Claude Code transcripts, or
        paths that name your projects. `ccdrift report --json` holds aggregates only and is safe
        to share; `ccdrift report --html` names your project folders and is not.
  - type: input
    id: version
    attributes:
      label: ccdrift version
      description: The output of `ccdrift --version`.
    validations:
      required: true
  - type: input
    id: claude-code
    attributes:
      label: Claude Code version
      description: The output of `claude --version`.
  - type: dropdown
    id: os
    attributes:
      label: OS
      options:
        - macOS
        - Linux
        - Other
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: The command you ran and what it printed
      description: With paths and project names removed.
      render: text
