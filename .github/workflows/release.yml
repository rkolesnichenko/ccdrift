name: release

# Publishing runs on a version tag, e.g. `git tag v0.11.0 && git push origin v0.11.0`.
# `tests.yml` runs on any push, so the tag is tested as well; what this workflow adds is a
# check that the built distributions really install and report the version the tag claims.
#
# No credentials are configured: PyPI is reached through Trusted Publishing (OIDC), set up
# once and already in place:
#   owner rkolesnichenko, repository ccdrift, workflow release.yml, environment pypi.
# It was registered before ccdrift existed on PyPI, so it went in as a *pending* publisher
# at pypi.org/manage/account/publishing, the only form that works for a name with no project
# behind it. The first publish turns it into an ordinary publisher, and from then on it is
# edited under the project's own publishing settings instead.
# The `pypi` environment exists in the repository's settings, restricted to `v*` tags, so a
# push to a branch cannot reach the job that mints the token.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+rc[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+[ab][0-9]+"

# Each job asks for what it needs and nothing more: only `publish` may mint the token that
# speaks to PyPI, so a build step can't reach it. Actions are pinned by commit, since a tag
# can be moved to other code and this is the workflow that ships to everyone.
permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: false

      - name: Build
        run: uv build

      # Installs each distribution on its own and runs the command it ships, so a release
      # can't go out missing a module, missing its entry point, or carrying a version the
      # tag doesn't name.
      - name: Both distributions install and report the tag's version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          for dist in dist/*.whl dist/*.tar.gz; do
            reported="$(uv run --isolated --no-project --with "$dist" -- ccdrift --version)"
            if [ "$reported" != "ccdrift $tag" ]; then
              echo "$dist reports '$reported', but the tag says 'ccdrift $tag'" >&2
              exit 1
            fi
            echo "$dist: $reported"
          done

      - name: Upload distributions as artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/

  publish:
    needs:
      - build
    runs-on: ubuntu-latest
    environment:
      name: pypi
    permissions:
      id-token: write
    steps:
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: false

      - name: Download distributions artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      # PEP 740: signs each distribution so PyPI can show it was built by this workflow.
      - name: Generate PEP 740 attestations
        uses: astral-sh/attest-action@f589a42a7efb6fe400b4f400de60b4bc90390027 # v0.0.6

      - name: Publish
        run: uv publish
