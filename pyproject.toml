[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "ccdrift"
dynamic = ["version"]
description = "A check for silent changes in Claude Code's prompt caching, Haiku use, settings, context, hooks, failed requests and logged fields, with where the tokens went, read from your local session logs"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Roman Kolesnichenko" }]
keywords = ["claude-code", "claude", "prompt-cache", "monitoring", "regression-detection", "observability"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Monitoring",
    "Topic :: Utilities",
]
dependencies = ["pandas>=2.2", "numpy>=1.23"]

[project.urls]
Homepage = "https://github.com/rkolesnichenko/ccdrift"
Repository = "https://github.com/rkolesnichenko/ccdrift"
Issues = "https://github.com/rkolesnichenko/ccdrift/issues"
Changelog = "https://github.com/rkolesnichenko/ccdrift/releases"

[project.scripts]
ccdrift = "ccdrift.cli:main"

[dependency-groups]
dev = ["pytest"]
lab = ["matplotlib"]

[tool.hatch.version]
path = "src/ccdrift/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/ccdrift"]

[tool.hatch.build.targets.sdist]
only-include = ["src", "tests", "lab", "docs/findings.md", "README.md", "LICENSE", "pyproject.toml"]

[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["tests", "lab"]
